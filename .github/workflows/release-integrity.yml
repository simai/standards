name: Combined stable release integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-1.0.txt
      - run: python tools/verify_release.py
      - run: python -m unittest discover -s standard-contract/1.0
      - run: python -m unittest discover -s standard-contract/lifecycle
      - run: python -m unittest discover -s experiments/standard-contract
      - run: python -m unittest discover -s experiments/standard-contract/draft-2
      - run: python -m unittest discover -s experiments/standard-contract/lifecycle
