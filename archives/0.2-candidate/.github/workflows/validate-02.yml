name: Validate AI First 0.2 candidate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-0.2.txt
      - run: AI_FIRST_NODE=$(command -v node) python -m unittest discover -s tests -v
      - run: python tools/check_repository.py
      - run: python tools/benchmark02.py
